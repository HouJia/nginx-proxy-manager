<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PUBLIC_HOST}} · 家庭服务</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f7fb; --card: #fff; --text: #1a1a1a; --muted: #5f6368; --link: #0b57d0; --border: #e0e3e7; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1117; --card: #1a1d27; --text: #e8eaed; --muted: #9aa0a6; --link: #8ab4f8; --border: #3c4043; }
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 1.5rem 1rem 3rem; }
    .wrap { max-width: 42rem; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
    .sub { color: var(--muted); font-size: .9rem; margin-bottom: 1.25rem; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin-bottom: 1.25rem; padding: .75rem 1rem; background: var(--card); border: 1px solid var(--border); border-radius: .75rem; }
    .toolbar label { font-size: .875rem; font-weight: 600; }
    select { padding: .4rem .65rem; border-radius: .5rem; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: .875rem; }
    .hint { font-size: .8rem; color: var(--muted); flex: 1 1 100%; }
    section { margin-bottom: 1.25rem; }
    section h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 .5rem; }
    .grid { display: grid; gap: .5rem; }
    .card { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .85rem 1rem; background: var(--card); border: 1px solid var(--border); border-radius: .65rem; text-decoration: none; color: inherit; transition: border-color .15s; }
    .card:hover { border-color: var(--link); }
    .card strong { font-size: .95rem; display: block; }
    .card span.desc-line { font-size: .78rem; color: var(--muted); word-break: break-all; display: block; }
    .badge { font-size: .7rem; padding: .15rem .45rem; border-radius: .35rem; background: var(--bg); color: var(--muted); white-space: nowrap; }
    /* 其它：多列紧凑 + 仅复制 */
    section.misc .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .4rem; }
    @media (min-width: 36rem) { section.misc .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    section.misc .card { cursor: default; flex-direction: column; align-items: stretch; padding: .5rem .55rem; opacity: .9; height: 100%; }
    section.misc .card:hover { border-color: var(--border); box-shadow: none; }
    section.misc .card-body { min-width: 0; flex: 1; }
    section.misc .card strong { font-size: .75rem; font-weight: 600; margin-bottom: .1rem; }
    section.misc .card .desc-line { font-size: .65rem; margin-bottom: .25rem; line-height: 1.25; }
    section.misc .url-row { display: flex; flex-direction: row; align-items: center; gap: .35rem; flex-wrap: nowrap; width: 100%; min-width: 0; }
    section.misc .url-text { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; font-size: .62rem; color: var(--muted); cursor: pointer; line-height: 1.3; user-select: text; font-family: ui-monospace, monospace; }
    section.misc .url-text:hover { color: var(--text); }
    section.misc .copy-btn { flex: 0 0 auto; margin-left: auto; font-size: .62rem; padding: .15rem .35rem; border-radius: .3rem; border: 1px solid var(--border); background: var(--bg); color: var(--muted); cursor: pointer; white-space: nowrap; }
    section.misc .copy-btn:hover { border-color: var(--link); color: var(--link); }
    footer { margin-top: 2rem; font-size: .75rem; color: var(--muted); }
    .toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--border); padding: .4rem .75rem; border-radius: .5rem; font-size: .75rem; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>家庭服务入口</h1>
    <p class="sub">HTTPS 端口 <b>44</b> · 主机 <b>{{PUBLIC_HOST}}</b></p>

    <div class="toolbar">
      <label for="mode">访问方式</label>
      <select id="mode" aria-label="访问方式">
        <option value="remote">Remote（公网域名 :44）</option>
        <option value="local">Local（局域网 IP / 端口）</option>
      </select>
      <span class="hint" id="modeHint">Remote：链接经 NPM 反代，适合外网或统一域名。</span>
    </div>

    <section>
      <h2>订阅与分流</h2>
      <div class="grid" id="svc-sub"></div>
    </section>
    <section>
      <h2>NAS 与管理</h2>
      <div class="grid" id="svc-nas"></div>
    </section>
    <section>
      <h2>媒体与存储</h2>
      <div class="grid" id="svc-media"></div>
    </section>
    <section class="misc">
      <h2>其它</h2>
      <div class="grid" id="svc-misc"></div>
    </section>

    <footer>公网 <code>https://{{PUBLIC_HOST}}:44/index/</code> · 内网 <code>http://{{LAN_IP}}:88/index/</code></footer>
  </div>
  <div class="toast" id="toast">已复制</div>
  <script>
    const LAN = "{{LAN_IP}}";
    const HOST = "{{PUBLIC_HOST}}";
    const LAN_INDEX = "http://" + LAN + ":88/index/";
    function ellipsisStart(str, maxLen) {
      if (!str || str.length <= maxLen) return str;
      return "\u2026" + str.slice(-(maxLen - 1));
    }
    const services = {
      sub: [
        { name: "Subconverter API", desc: "订阅转换 /subapi", remote: "/subapi/version", local: "http://" + LAN + ":25500/sub?" },
        { name: "Sub-web", desc: "订阅转换 Web UI", remote: "/subw/", local: "http://" + LAN + ":58081/subw/" },
        { name: "妙妙屋", desc: "多用户订阅 / 规则类别", remote: "/mmw/", local: "http://" + LAN + ":8080/mmw/" },
        { name: "Sublink", desc: "轻量按需分流", remote: "/sublink/", local: "http://" + LAN + ":58087/sublink/" }
      ],
      nas: [
        { name: "QNAP /ts/", desc: "TS 系列路径反代", remote: "/ts/", local: "https://" + LAN + ":5001/" },
        { name: "群晖 /ds/", desc: "DS 192.168.0.4", remote: "/ds/", local: "https://192.168.0.4:5001/" }
      ],
      media: [
        { name: "Jellyfin", desc: "媒体库", remote: "/jellyfin/", local: "http://" + LAN + ":8096/" }
      ],
      misc: [
        { name: "QNAP 登录", desc: "管理登录", remote: "/cgi-bin/login.html", local: "https://" + LAN + ":5001/cgi-bin/login.html" },
        { name: "QNAP 桌面", desc: "NAS 主界面", remote: "/", local: "https://" + LAN + ":5001/" },
        { name: "WebDAV", desc: "文件 WebDAV", remote: "/webdav/", local: "https://" + LAN + ":5008/" },
        { name: "WebDAV /home/", desc: "Home 目录", remote: "/home/", local: "https://" + LAN + ":5008/home/" }
      ]
    };
    function url(s, mode) {
      if (mode === "local") return s.local;
      if (s.remote.startsWith("/")) return "https://" + HOST + ":44" + s.remote;
      return s.remote;
    }
    function showToast() {
      const t = document.getElementById("toast");
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 1200);
    }
    function copyText(text) {
      navigator.clipboard.writeText(text).then(showToast).catch(() => prompt("复制链接：", text));
    }
    function linkCard(s, href, mode) {
      return '<a class="card" href="' + href + '" target="_blank" rel="noopener">' +
        '<div><strong>' + s.name + '</strong><span class="desc-line">' + s.desc + ' · ' + href + '</span></div>' +
        '<span class="badge">' + (mode === "local" ? "LAN" : "Remote") + '</span></a>';
    }
    function miscCard(s, href) {
      const shown = ellipsisStart(href, 38);
      return '<div class="card">' +
        '<div class="card-body"><strong>' + s.name + '</strong><span class="desc-line">' + s.desc + '</span>' +
        '<div class="url-row"><span class="url-text" data-url="' + href.replace(/"/g, "&quot;") + '" title="' + href.replace(/"/g, "&quot;") + '">' + shown + '</span>' +
        '<button type="button" class="copy-btn" data-url="' + href.replace(/"/g, "&quot;") + '">复制</button></div></div></div>';
    }
    function bindMiscCopy(root) {
      root.querySelectorAll(".url-text, .copy-btn").forEach(el => {
        el.addEventListener("click", e => {
          e.preventDefault();
          e.stopPropagation();
          copyText(el.getAttribute("data-url"));
        });
      });
    }
    function render() {
      const mode = document.getElementById("mode").value;
      document.getElementById("modeHint").textContent = mode === "local"
        ? "Local：各服务直连内网端口。本页内网入口 " + LAN_INDEX
        : "Remote：链接经 NPM 反代（域名 :44），适合外网或统一入口。";
      document.getElementById("svc-sub").innerHTML = services.sub.map(s => linkCard(s, url(s, mode), mode)).join("");
      document.getElementById("svc-nas").innerHTML = services.nas.map(s => linkCard(s, url(s, mode), mode)).join("");
      document.getElementById("svc-media").innerHTML = services.media.map(s => linkCard(s, url(s, mode), mode)).join("");
      const miscEl = document.getElementById("svc-misc");
      miscEl.innerHTML = services.misc.map(s => miscCard(s, url(s, mode))).join("");
      bindMiscCopy(miscEl);
    }
    document.getElementById("mode").addEventListener("change", render);
    render();
  </script>
</body>
</html>
